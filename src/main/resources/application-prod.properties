# Perfil de produção. Banco/e-mail/JWT já são lidos via variável de ambiente no
# application.properties base -- aqui só ficam os overrides que só fazem sentido em produção.

# Swagger desabilitado em produção (fica ligado por padrão em dev)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Flyway desabilitado em produção: o MySQLNamedLockTemplate do Flyway usa GET_LOCK(),
# que não funciona no gateway do TiDB Serverless (conexão cai). Migrations em produção
# são aplicadas manualmente via SQL Editor do TiDB Cloud.
spring.flyway.enabled=false
