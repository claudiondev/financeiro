# Configuração base, compartilhada por todos os perfis (dev/prod). Valores específicos
# de ambiente (endereço do banco, credenciais) vêm de variáveis de ambiente -- local via
# .env, em produção via variáveis configuradas no painel do serviço de hospedagem.
spring.application.name=financeiro

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Desabilita o anti-pattern "Open Session in View": sem isso, o Hibernate mantém a conexão
# com o banco aberta durante toda a serialização HTTP da resposta.
spring.jpa.open-in-view=false

# Baseline do Flyway: o schema já existia antes do Flyway entrar no projeto, então a
# baseline marca o estado atual como V1 e só aplica as migrations novas (V2+) por cima dele.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline anterior a introducao do Flyway

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Lembrete de conta fixa por e-mail: só liga quando MAIL_USERNAME/MAIL_PASSWORD forem
# credenciais reais. O aviso dentro do app (Resumo/Contas Fixas) funciona independente disso.
app.email.lembrete-habilitado=${EMAIL_LEMBRETE_HABILITADO:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ${PORT} é injetado automaticamente pela plataforma de hospedagem (ex: Render); 8080 é
# o fallback para rodar localmente.
server.port=${PORT:8080}

# Upload de extrato OFX (importação) — default do Spring (1MB/10MB) é apertado pra um
# extrato de muitos meses; 5MB cobre qualquer caso realista sem abrir demais.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
